# Used when running the test suites. Separate database so a test run can
# drop and rebuild everything without touching development data.
database:
  host: 127.0.0.1
  port: 3306
  database: inventory_order_management
  connect_timeout_seconds: 5

retry:
  # Fewer retries: a test should fail fast rather than wait around.
  max_attempts: 2
  base_delay_seconds: 0.25
  max_delay_seconds: 2.0

logging:
  level: DEBUG
  file: logs/test.log
